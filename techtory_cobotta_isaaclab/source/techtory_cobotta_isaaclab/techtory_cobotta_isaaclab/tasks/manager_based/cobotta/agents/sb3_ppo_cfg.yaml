# PPO defaults for the reward-free Cobotta environment.
# Reference: https://github.com/DLR-RM/rl-baselines3-zoo
seed: 42

n_timesteps: !!float 1e7
policy: 'MlpPolicy'
n_steps: 24
# Converted to batch_size = n_steps * num_envs / n_minibatches by process_sb3_cfg, so the
# minibatch size follows --num_envs instead of being fixed.
n_minibatches: 4
gae_lambda: 0.95
gamma: 0.99
n_epochs: 5
ent_coef: 0.005
learning_rate: !!float 1e-3
clip_range: 0.2
# A mapping, not a "dict(...)" string: process_sb3_cfg walks it and turns 'nn.*' strings
# into torch classes. The string form was evaluated by older Isaac Lab releases only.
policy_kwargs:
  activation_fn: 'nn.ELU'
  net_arch: [256, 128, 64]
vf_coef: 1.0
max_grad_norm: 1.0
device: "cuda:0"
# The 41 observations span radians, metres and newtons, so normalising them
# is not optional.
normalize_input: True
