[project]
name = "techtory-cobotta-isaaclab"
version = "0.1.0"
description = "Denso Cobotta Pro (CVRB0609) + OnRobot RG6 in the Techtory cell, as an Isaac Lab robot with a wrist force/torque sensor."
readme = "README.md"
authors = [
    { name = "ipa326", email = "prachandabhanu@gmail.com" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "techtory-cobotta-isaaclab-ext",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv.sources]
# The extension itself. Isaac Lab and Isaac Sim are NOT listed as dependencies:
# they are installed once into the interpreter this project runs under
# (/opt/isaac-venv here) and shared, which is how Isaac Lab's own project
# template expects an extension to be consumed. See the README.
techtory-cobotta-isaaclab-ext = { path = "source/techtory_cobotta_isaaclab", editable = true }

[tool.uv]
# Some NVIDIA-hosted dependencies have mismatched versions across
# pypi.nvidia.com and PyPI. unsafe-best-match lets uv resolve the correct
# version from any index, and prerelease=allow covers packages that only
# publish pre-release wheels.
index-strategy = "unsafe-best-match"
prerelease = "allow"

# Add pypi.nvidia.com so that Isaac Sim wheels resolve without --extra-index-url.
[[tool.uv.index]]
url = "https://pypi.nvidia.com"
explicit = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    "logs",
    "_isaac_sim",
    ".vscode",
    "_*",
    ".git",
    # Generated from the ROS robot description; not ours to lint.
    "source/techtory_cobotta_isaaclab/techtory_cobotta_isaaclab/robot/assets",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "C90",    # mccabe complexity
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
]
ignore = [
    "E402",   # Module level import not at top of file
    "RET504", # Unnecessary variable assignment before return statement
    "RET505", # Unnecessary elif after return statement
    "SIM102", # Use a single if-statement instead of nested if-statements
    "SIM108", # Use ternary operator instead of if-else statement
    "UP006",  # Use 'dict' instead of 'Dict' type annotation
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Re-export modules deliberately.

[tool.ruff.lint.mccabe]
max-complexity = 30

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "omniverse-extensions",
    "isaaclab",
    "isaaclab-rl",
    "isaaclab-tasks",
    "isaaclab-assets",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
"omniverse-extensions" = ["isaacsim", "omni", "pxr", "carb", "usdrt", "Semantics"]
"isaaclab" = ["isaaclab", "isaaclab_newton", "isaaclab_physx"]
"isaaclab-rl" = ["isaaclab_rl"]
"isaaclab-tasks" = ["isaaclab_tasks"]
"isaaclab-assets" = ["isaaclab_assets"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
include = ["source", "scripts", "tests"]
exclude = [
    "**/__pycache__",
    "**/_isaac_sim",
    "**/logs",
    ".git",
    ".vscode",
]
typeCheckingMode = "basic"
pythonVersion = "3.12"
pythonPlatform = "Linux"
enableTypeIgnoreComments = true
reportMissingImports = "none"
reportMissingModuleSource = "none"
reportGeneralTypeIssues = "none"
reportOptionalMemberAccess = "warning"
reportPrivateUsage = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.codespell]
skip = '*.usd,*.usda,*.usdz,*.dae,*.stl,*.urdf,_isaac_sim*,*/_build'
quiet-level = 0
ignore-words-list = "haa,slq,collapsable,buss,reacher,thirdparty"
